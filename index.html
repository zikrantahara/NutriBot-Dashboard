<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriBot Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>NUTRIBOT - DASHBOARD MONITORING</h1>
    </header>

    <main class="grid-container">
        
        <!-- PANEL 1: VOLUME AIR -->
        <div class="card">
            <h2>Volume Air</h2>
            <div class="tangki-air">
                <div class="gelombang-air" id="animasi-air"></div>
                <div class="persentase" id="teks-volume-air">0%</div>
            </div>
        </div>

        <!-- PANEL 2: NUTRISI & SUHU -->
        <div class="card">
            <h2>Parameter Nutrisi & Suhu</h2>
            
            <!-- Notifikasi Merah -->
            <div id="notif-nutrisi" class="alert-merah">
                ⚠️ PERINGATAN: Cairan Nutrisi Habis!
            </div>

            <div class="flex-dua-kolom">
                <!-- Tabung Nutrisi -->
                <div class="item-tengah">
                    <div class="tabung-nutrisi">
                        <div class="isi-nutrisi" id="animasi-nutrisi"></div>
                        <div class="teks-nutrisi-center" id="teks-level-nutrisi">100%</div>
                    </div>
                    <p class="label-kecil">Level AB Mix</p>
                </div>

                <!-- Lingkaran Suhu -->
                <div class="item-tengah">
                    <div class="cincin-suhu">
                        <span id="teks-suhu">28</span><span class="satuan">°C</span>
                    </div>
                    <p class="label-kecil">Suhu Air</p>
                </div>
            </div>
        </div>

        <!-- PANEL 3: KONTROL MANUAL (RE-DESIGN) -->
        <div class="card panel-kontrol">
            <h2>Kontrol Manual</h2>
            <div class="kontrol-wrapper">
                <div class="ikon-pompa">
                    <!-- Ikon Tetesan Air / Pompa -->
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
                    </svg>
                </div>
                <h3>Pompa AB Mix</h3>
                <p class="deskripsi-kontrol">Kendali bypass (pengabaian sensor) untuk aktuator nutrisi.</p>
                
                <div class="switch-container">
                    <span class="label-off">OFF</span>
                    <label class="switch switch-besar">
                        <input type="checkbox" id="pompa-ab">
                        <span class="slider"></span>
                    </label>
                    <span class="label-on">ON</span>
                </div>
            </div>
        </div>

        <!-- PANEL 4: GRAFIK pH -->
        <div class="card">
            <h2>Riwayat Parameter pH</h2>
            <canvas id="grafikRiwayat"></canvas>
        </div>

    </main>

    <!-- Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    
    <!-- Naikkan versi cache busting agar langsung berubah -->
    <script src="app.js?v=4.0"></script>
</body>
</html>
